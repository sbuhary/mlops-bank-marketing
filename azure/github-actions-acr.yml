name: Build and Push to ACR

on:
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image bank-marketing-api:${{ github.sha }} \
            .
